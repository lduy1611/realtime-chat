<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>realtime-chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Authentication -->
  <section id="auth-screen" class="screen">
    <div class="card auth-card">
      <h1 class="logo">realtime-chat</h1>
      <p class="muted">Sign in or create an account to chat.</p>
      <form id="login-form" class="auth-form" autocomplete="on">
        <label>Username<input name="username" maxlength="20" autocomplete="username" required /></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit" class="btn">Sign in</button>
        <button id="show-register" type="button" class="btn ghost">Create account</button>
      </form>
      <form id="register-form" class="auth-form" autocomplete="on" hidden>
        <label>Username<input name="username" maxlength="20" autocomplete="username" required /></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required /></label>
        <p class="muted auth-hint">Username: 2–20 letters, numbers, _ or -. Password: at least 8 characters, at most 72 UTF-8 bytes.</p>
        <button type="submit" class="btn">Register</button>
        <button id="show-login" type="button" class="btn ghost">Back to sign in</button>
      </form>
      <p id="auth-error" class="error" role="alert"></p>
    </div>
  </section>

  <!-- Join screen -->
  <section id="join-screen" class="screen hidden">
    <form id="join-form" class="card" autocomplete="off">
      <h1 class="logo">realtime-chat</h1>
      <p class="muted">Signed in as <strong id="account-name"></strong>. Choose a room.</p>
      <label>
        Room
        <input id="room" name="room" maxlength="20" placeholder="e.g. general" required list="room-options" />
        <datalist id="room-options"></datalist>
      </label>
      <p id="join-error" class="error" role="alert"></p>
      <button type="submit" class="btn">Join room</button>
      <button id="join-logout-btn" class="btn ghost" type="button">Logout</button>
      <div id="join-rooms" class="room-chips"></div>
    </form>
  </section>

  <!-- Chat screen -->
  <section id="chat-screen" class="screen hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="logo small">realtime-chat</span>
        <button id="sidebar-close" class="icon-btn" aria-label="Close sidebar">&times;</button>
      </div>
      <div class="sidebar-section">
        <h2>Rooms</h2>
        <ul id="room-list" class="list"></ul>
      </div>
      <div class="sidebar-section">
        <h2>Online in <span id="room-name-side"></span></h2>
        <ul id="user-list" class="list"></ul>
      </div>
      <div class="sidebar-footer">
        <span id="me" class="me"></span>
        <button id="logout-btn" class="btn ghost" type="button">Logout</button>
        <button id="leave-btn" class="btn ghost">Leave room</button>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <button id="sidebar-open" class="icon-btn" aria-label="Open sidebar">&#9776;</button>
        <h1>#<span id="room-name"></span></h1>
        <span id="status" class="status online">online</span>
        <div id="connection-test-controls" class="connection-test-controls" hidden>
          <button id="simulate-disconnect" class="btn ghost test-btn" type="button">Simulate Disconnect</button>
          <button id="simulate-reconnect" class="btn ghost test-btn" type="button" disabled>Reconnect</button>
        </div>
      </header>
      <ul id="messages" class="messages" aria-live="polite"></ul>
      <p id="typing" class="typing"></p>
      <form id="message-form" class="composer" autocomplete="off">
        <input id="message-input" maxlength="500" placeholder="Message the room, or /pm user message" />
        <input id="file-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />
        <button id="file-button" type="button" class="btn ghost" aria-label="Attach a file">Attach file</button>
        <button type="submit" class="btn">Send</button>
      </form>
    </main>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="message-id.js"></script>
  <script src="outbox.js"></script>
  <script src="app.js"></script>
</body>
</html>
